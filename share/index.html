<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PIXA SHARE has moved</title>
<meta http-equiv="refresh" content="2; url=https://utelinor-hub.github.io/pixa-share/" />
<meta name="theme-color" content="#0d3b66" />
<style>
  /* v3.30.2 — PIXA SHARE now lives in its OWN repository
     (utelinor-hub/Pixa-share → https://utelinor-hub.github.io/pixa-share/).
     This tiny stub keeps old phones that installed the app from
     /shivam-pixa/share/ working: they land here and are forwarded to the
     new home. The phone's installed PWA should be re-added from the new
     URL once. UI language: English only (project rule). */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
    background: #eef3f9; color: #14243a;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; border-radius: 18px; padding: 28px 24px;
    max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 8px 30px rgba(13,59,102,.14);
  }
  .logo { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 14px; }
  h1 { font-size: 19px; margin: 0 0 8px; color: #0d3b66; }
  p { font-size: 14px; line-height: 1.55; color: #3c516b; margin: 0 0 18px; }
  a.go {
    display: inline-block; background: linear-gradient(135deg, #0d3b66, #1a6bb3);
    color: #fff; text-decoration: none; font-weight: 700; font-size: 15px;
    padding: 12px 22px; border-radius: 12px;
  }
  .hint { margin-top: 14px; font-size: 12px; color: #7b8ea3; }
</style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PIXA SHARE">
      <rect width="64" height="64" rx="16" fill="#0d3b66"/>
      <circle cx="44" cy="20" r="6" fill="#fff"/>
      <circle cx="44" cy="44" r="6" fill="#fff"/>
      <circle cx="20" cy="32" r="6" fill="#fff"/>
      <path d="M25 29l13-7M25 35l13 7" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>PIXA SHARE has moved</h1>
    <p>The app now lives at its own address. Taking you there in a
       moment&hellip;</p>
    <a class="go" href="https://utelinor-hub.github.io/pixa-share/">Open PIXA SHARE</a>
    <div class="hint">Tip: open the new link and choose &ldquo;Add to Home
      screen&rdquo; once, so the installed icon points to the new home.</div>
  </div>
  <script>
    /* JS redirect as backup for browsers that ignore meta refresh inside
       an offline-served Service Worker page */
    setTimeout(function () {
      location.replace('https://utelinor-hub.github.io/pixa-share/');
    }, 1500);
  </script>
</body>
</html>
